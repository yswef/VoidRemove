name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: New stable version tag to publish (for example v0.1.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build artifacts and publish release
    runs-on: windows-latest
    steps:
      # Manual releases run from the default branch and create a new tag at this
      # commit. Tag-push runs build the commit already named by the pushed tag.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Validate release tag and version
        id: release-meta
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Expected a stable semantic version tag like v0.1.1; got '$tag'."
          }

          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            if ($env:GITHUB_REF -ne "refs/heads/$($env:DEFAULT_BRANCH)") {
              throw "Manual releases must run from the default branch '$($env:DEFAULT_BRANCH)'."
            }
            $existingTag = git ls-remote --refs origin "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw "Could not check whether tag $tag already exists." }
            if (-not [string]::IsNullOrWhiteSpace(($existingTag -join "`n"))) {
              throw "Tag $tag already exists; use its tag-push run or publish a new version."
            }
            Write-Output "Tag $tag is new and will be created for this default-branch commit."
          }

          $props = Get-Content Directory.Build.props -Raw
          $match = [regex]::Match($props, '<VersionPrefix>\s*([^<]+)\s*</VersionPrefix>')
          if (-not $match.Success) {
            throw 'Could not read VersionPrefix from Directory.Build.props.'
          }

          $projectVersion = $match.Groups[1].Value.Trim()
          $tagVersion = $tag.Substring(1)
          if ($projectVersion -ne $tagVersion) {
            throw "Release tag $tag does not match Directory.Build.props VersionPrefix $projectVersion."
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Output "Building $tag (VersionPrefix $projectVersion)."

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Verify repository consistency
        run: python tools/verify_repo.py

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore VoidRemove.sln

      - name: Publish WPF (x64, single file)
        run: >
          dotnet publish src/VoidRemove.UI.Wpf -c Release -r win-x64 --self-contained true --no-restore
          -p:PublishSingleFile=true -o publish/wpf

      - name: Rename WPF x64 artifact
        shell: pwsh
        run: |
          $source = 'publish/wpf/VoidRemove.Wpf.exe'
          if (-not (Test-Path $source)) { throw "Publish did not produce $source." }
          Move-Item -LiteralPath $source -Destination 'publish/wpf/VoidRemove-Wpf-x64.exe'

      - name: Publish WPF (arm64, single file)
        run: >
          dotnet publish src/VoidRemove.UI.Wpf -c Release -r win-arm64 --self-contained true --no-restore
          -p:PublishSingleFile=true -o publish/wpf-arm64

      - name: Rename WPF arm64 artifact
        shell: pwsh
        run: |
          $source = 'publish/wpf-arm64/VoidRemove.Wpf.exe'
          if (-not (Test-Path $source)) { throw "Publish did not produce $source." }
          Move-Item -LiteralPath $source -Destination 'publish/wpf-arm64/VoidRemove-Wpf-arm64.exe'

      - name: Publish WinUI (x64, single file)
        run: >
          dotnet publish src/VoidRemove.UI.WinUI -c Release -r win-x64 --self-contained true --no-restore
          -p:PublishSingleFile=true -o publish/winui

      - name: Rename WinUI x64 artifact
        shell: pwsh
        run: |
          $source = 'publish/winui/VoidRemove.WinUI.exe'
          if (-not (Test-Path $source)) { throw "Publish did not produce $source." }
          Move-Item -LiteralPath $source -Destination 'publish/winui/VoidRemove-WinUI-x64.exe'

      - name: Prepare Inno Setup
        shell: pwsh
        run: |
          $candidates = @(
            'C:\Program Files (x86)\Inno Setup 6',
            'C:\Program Files\Inno Setup 6'
          )
          $found = $null
          foreach ($directory in $candidates) {
            if (Test-Path (Join-Path $directory 'ISCC.exe')) {
              $found = $directory
              break
            }
          }

          if (-not $found) {
            Write-Output 'Inno Setup was not pre-installed; installing it with Chocolatey.'
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Chocolatey failed to install Inno Setup (exit $LASTEXITCODE)." }
            foreach ($directory in $candidates) {
              if (Test-Path (Join-Path $directory 'ISCC.exe')) {
                $found = $directory
                break
              }
            }
          }

          if (-not $found) { throw 'Could not locate ISCC.exe after checking the standard install paths.' }
          $iscc = Join-Path $found 'ISCC.exe'
          "ISCC_PATH=$iscc" >> $env:GITHUB_ENV
          Write-Output "Using Inno Setup compiler: $iscc"

      - name: Verify published artifacts and installer inputs
        shell: pwsh
        run: |
          $expected = @(
            'publish\wpf\VoidRemove-Wpf-x64.exe',
            'publish\wpf-arm64\VoidRemove-Wpf-arm64.exe',
            'publish\winui\VoidRemove-WinUI-x64.exe',
            'data\bundleware.json',
            'assets\icon.ico',
            'assets\setup-wizard.bmp',
            'assets\setup-header.bmp',
            'LICENSE'
          )
          $missing = @($expected | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) })
          if ($missing.Count -gt 0) {
            throw "Missing release input(s): $($missing -join ', ')"
          }

          foreach ($file in $expected | Where-Object { $_.EndsWith('.exe') }) {
            $length = (Get-Item -LiteralPath $file).Length
            if ($length -lt 1MB) { throw "Published executable is unexpectedly small ($length bytes): $file" }
            Write-Output "OK $file ($length bytes)"
          }

      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath $env:ISCC_PATH -PathType Leaf)) {
            throw "Inno Setup compiler not found at $env:ISCC_PATH."
          }
          $versionOutput = @(& $env:ISCC_PATH /? 2>&1 | Select-Object -First 5)
          Write-Host "::notice::ISCC path: $env:ISCC_PATH"
          Write-Host "::notice::ISCC version output: $($versionOutput -join ', ')"
          $scriptBytes = [System.IO.File]::ReadAllBytes('installer\setup.iss')
          $hasBom = ($scriptBytes.Length -ge 3 -and $scriptBytes[0] -eq 0xEF -and $scriptBytes[1] -eq 0xBB -and $scriptBytes[2] -eq 0xBF)
          if (-not $hasBom) {
            Write-Host '::notice::Adding UTF-8 BOM to setup.iss after checkout.'
            $utf8Bom = [byte[]]@(0xEF, 0xBB, 0xBF)
            $scriptBytes = $utf8Bom + $scriptBytes
            [System.IO.File]::WriteAllBytes('installer\setup.iss', $scriptBytes)
            $hasBom = $true
          }
          Write-Host "::notice::setup.iss has UTF-8 BOM: $hasBom ($($scriptBytes.Length) bytes)"

          New-Item -ItemType Directory -Force -Path 'publish/installer' | Out-Null
          Write-Host '::group::ISCC output'
          $compilerOutput = @(& $env:ISCC_PATH installer\setup.iss 2>&1)
          $compilerExitCode = $LASTEXITCODE
          $compilerOutput | ForEach-Object { "$_" } | Tee-Object -FilePath 'publish/installer/iscc.log'
          Write-Host '::endgroup::'
          Write-Host "::notice::ISCC exit code: $compilerExitCode"
          if ($compilerExitCode -ne 0) {
            foreach ($line in $compilerOutput) {
              if ([string]$line -match 'Error|error|Fatal') { Write-Host "::error::$line" }
            }
            throw "Inno Setup failed with exit code $compilerExitCode."
          }

          $installer = 'publish/installer/VoidRemove-Setup.exe'
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Inno Setup succeeded but did not create $installer."
          }
          Write-Output "Installer created: $installer ($((Get-Item $installer).Length) bytes)"

      - name: Compute SHA-256 checksums
        shell: pwsh
        run: |
          $files = @(
            'publish/wpf/VoidRemove-Wpf-x64.exe',
            'publish/wpf-arm64/VoidRemove-Wpf-arm64.exe',
            'publish/winui/VoidRemove-WinUI-x64.exe',
            'publish/installer/VoidRemove-Setup.exe'
          )
          $lines = foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Cannot checksum missing asset: $file" }
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content -Path publish/SHA256SUMS.txt -Encoding utf8NoBOM
          Write-Output "Wrote checksums for $($files.Count) release executables."

      - name: Upload build outputs for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VoidRemove-${{ steps.release-meta.outputs.tag }}-build
          path: |
            publish/**/*.exe
            publish/installer/iscc.log
            publish/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ steps.release-meta.outputs.tag }}"
          publish/wpf/VoidRemove-Wpf-x64.exe
          publish/wpf-arm64/VoidRemove-Wpf-arm64.exe
          publish/winui/VoidRemove-WinUI-x64.exe
          publish/installer/VoidRemove-Setup.exe
          publish/SHA256SUMS.txt
          --target "${{ github.sha }}"
          --title "VoidRemove ${{ steps.release-meta.outputs.tag }}"
          --generate-notes
