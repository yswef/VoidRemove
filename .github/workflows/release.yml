name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build artifacts and publish release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore VoidRemove.sln

      - name: Publish WPF (x64, single file)
        run: >
          dotnet publish src/VoidRemove.UI.Wpf -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -o publish/wpf

      - name: Rename WPF x64 artifact
        shell: pwsh
        run: Rename-Item publish/wpf/VoidRemove.Wpf.exe VoidRemove-Wpf-x64.exe

      - name: Publish WPF (arm64, single file)
        run: >
          dotnet publish src/VoidRemove.UI.Wpf -c Release -r win-arm64 --self-contained true
          -p:PublishSingleFile=true -o publish/wpf-arm64

      - name: Rename WPF arm64 artifact
        shell: pwsh
        run: Rename-Item publish/wpf-arm64/VoidRemove.Wpf.exe VoidRemove-Wpf-arm64.exe

      - name: Publish WinUI (x64, single file)
        run: >
          dotnet publish src/VoidRemove.UI.WinUI -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -o publish/winui

      - name: Rename WinUI x64 artifact
        shell: pwsh
        run: Rename-Item publish/winui/VoidRemove.WinUI.exe VoidRemove-WinUI-x64.exe

      - name: Prepare Inno Setup
        shell: pwsh
        run: |
          # windows-latest ships with Inno Setup 6 pre-installed.
          # Prefer the pre-installed copy; fall back to choco only if needed.
          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6",
            "C:\Program Files\Inno Setup 6"
          )
          $found = $null
          foreach ($dir in $candidates) {
            if (Test-Path "$dir\ISCC.exe") {
              $found = $dir
              break
            }
          }
          if (-not $found) {
            Write-Output "Inno Setup not pre-installed, installing via choco..."
            choco install innosetup -y --no-progress
            foreach ($dir in $candidates) {
              if (Test-Path "$dir\ISCC.exe") {
                $found = $dir
                break
              }
            }
          }
          if (-not $found) {
            Write-Error "Could not locate ISCC.exe after install"
            exit 1
          }
          Write-Output "Found Inno Setup at: $found"
          echo $found >> $env:GITHUB_PATH

      - name: Verify published artifacts
        shell: pwsh
        run: |
          Write-Output "=== Checking expected files before Inno Setup ==="
          $expected = @(
            "publish\wpf\VoidRemove-Wpf-x64.exe",
            "publish\winui\VoidRemove-WinUI-x64.exe",
            "data\bundleware.json",
            "assets\icon.ico",
            "assets\setup-wizard.bmp",
            "assets\setup-header.bmp",
            "LICENSE"
          )
          foreach ($f in $expected) {
            if (Test-Path $f) {
              $size = (Get-Item $f).Length
              Write-Output "  OK  $f ($size bytes)"
            } else {
              Write-Output "  MISSING  $f"
            }
          }
          Write-Output "=== iscc version ==="
          iscc /? 2>&1 | Select-Object -First 3

      - name: Build installer
        shell: pwsh
        run: |
          Write-Output "=== Running ISCC ==="
          Write-Output "Working directory: $(Get-Location)"
          Write-Output "ISCC path: $(Get-Command iscc -ErrorAction SilentlyContinue).Source"
          Write-Output "ISS file exists: $(Test-Path installer\setup.iss)"
          Write-Output ""
          Write-Output "=== ISS file content (first 30 lines) ==="
          Get-Content installer\setup.iss -Head 30
          Write-Output ""
          Write-Output "=== Appinfo.ini content ==="
          Get-Content installer\appinfo.ini
          Write-Output ""
          Write-Output "=== ISCC output ==="
          $proc = Start-Process -FilePath "iscc" -ArgumentList "installer\setup.iss" -NoNewWindow -Wait -PassThru -RedirectStandardOutput "iscc_stdout.txt" -RedirectStandardError "iscc_stderr.txt"
          Write-Output "Exit code: $($proc.ExitCode)"
          Write-Output ""
          Write-Output "=== ISCC stdout ==="
          Get-Content iscc_stdout.txt
          Write-Output ""
          Write-Output "=== ISCC stderr ==="
          Get-Content iscc_stderr.txt
          if ($proc.ExitCode -ne 0) {
            Write-Error "ISCC failed with exit code $($proc.ExitCode)"
            exit $proc.ExitCode
          }

      - name: Compute SHA-256 checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path publish -Recurse -File |
            Where-Object { $_.Extension -in ".exe" }
          $lines = $files | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $lines | Out-File -Encoding utf8 publish/SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          publish/wpf/VoidRemove-Wpf-x64.exe
          publish/wpf-arm64/VoidRemove-Wpf-arm64.exe
          publish/winui/VoidRemove-WinUI-x64.exe
          publish/installer/VoidRemove-Setup.exe
          publish/SHA256SUMS.txt
          --title "VoidRemove ${{ github.ref_name }}"
          --generate-notes
