name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore VoidRemove.sln

      - name: Build
        run: dotnet build VoidRemove.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/VoidRemove.Core.Tests -c Release --no-build --logger "trx;LogFileName=tests.trx"

      # Keep the release-only packaging path exercised by PR CI, not just when a tag is pushed.
      - name: Publish WPF x64 (single file)
        run: >
          dotnet publish src/VoidRemove.UI.Wpf -c Release -r win-x64 --self-contained true --no-restore
          -p:PublishSingleFile=true -o publish/wpf

      - name: Rename WPF x64 smoke-test output
        shell: pwsh
        run: Move-Item publish/wpf/VoidRemove.Wpf.exe publish/wpf/VoidRemove-Wpf-x64.exe

      - name: Publish WPF ARM64 (single file)
        run: >
          dotnet publish src/VoidRemove.UI.Wpf -c Release -r win-arm64 --self-contained true --no-restore
          -p:PublishSingleFile=true -o publish/wpf-arm64

      - name: Rename WPF ARM64 smoke-test output
        shell: pwsh
        run: Move-Item publish/wpf-arm64/VoidRemove.Wpf.exe publish/wpf-arm64/VoidRemove-Wpf-arm64.exe

      - name: Publish WinUI x64 (single file)
        run: >
          dotnet publish src/VoidRemove.UI.WinUI -c Release -r win-x64 --self-contained true --no-restore
          -p:PublishSingleFile=true -o publish/winui

      - name: Rename WinUI smoke-test output
        shell: pwsh
        run: Move-Item publish/winui/VoidRemove.WinUI.exe publish/winui/VoidRemove-WinUI-x64.exe

      - name: Prepare Inno Setup for packaging smoke test
        shell: pwsh
        run: |
          $candidates = @(
            'C:\Program Files (x86)\Inno Setup 6',
            'C:\Program Files\Inno Setup 6'
          )
          $found = $null
          foreach ($directory in $candidates) {
            if (Test-Path (Join-Path $directory 'ISCC.exe')) {
              $found = $directory
              break
            }
          }
          if (-not $found) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Chocolatey failed to install Inno Setup (exit $LASTEXITCODE)." }
            foreach ($directory in $candidates) {
              if (Test-Path (Join-Path $directory 'ISCC.exe')) {
                $found = $directory
                break
              }
            }
          }
          if (-not $found) { throw 'Could not locate Inno Setup ISCC.exe.' }
          "ISCC_PATH=$(Join-Path $found 'ISCC.exe')" >> $env:GITHUB_ENV

      - name: Compile installer (packaging smoke test)
        shell: pwsh
        run: |
          & $env:ISCC_PATH installer\setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE." }
          if (-not (Test-Path 'publish/installer/VoidRemove-Setup.exe')) {
            throw 'Inno Setup did not create publish/installer/VoidRemove-Setup.exe.'
          }

      - name: Surface failing tests as annotations
        if: always()
        shell: pwsh
        run: |
          $lines = @()
          Get-ChildItem -Recurse -Filter *.trx | ForEach-Object {
            [xml]$x = Get-Content $_.FullName
            $x.TestRun.Results.UnitTestResult |
              Where-Object { $_.outcome -eq 'Failed' } |
              ForEach-Object {
                $msg = ($_.Output.ErrorInfo.Message -replace '\s+', ' ').Trim()
                $lines += "$($_.testName) :: $msg"
              }
          }
          $total = ($lines | Measure-Object).Count
          if ($total -gt 0) {
            $body = ($lines -join "`n")
            if ($body.Length -gt 7000) { $body = $body.Substring(0, 7000) }
            Write-Output "::error::FAILURES=$total`n$body"
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/*.trx'

  offline-checks:
    name: Offline repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Repository consistency
        run: python tools/verify_repo.py

      - name: Identity mirrors up to date
        run: python tools/sync_appinfo.py --check
